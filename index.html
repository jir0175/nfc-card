
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sasha — personal card</title>

    <style>
        :root {
            --bg: #0b0c0e;
            --panel: #101216;
            --text: #e7e8ea;
            --muted: #777c84;
            --line: #24272d;
            --accent: #b7c7bd;
            --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
            --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
        }

        * {
            box-sizing: border-box
        }

        html {
            min-height: 100%;
            background: var(--bg)
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 10%,
                    #171a1e 0,
                    #0b0c0e 38%,
                    #08090a 100%);
            color: var(--text);
            font-family: var(--sans);
            display: grid;
            place-items: center;
            padding: 24px
        }

        .card {
            width: min(430px, 100%);
            border: 1px solid var(--line);
            background: rgba(13, 15, 18, .86);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, .42);
            backdrop-filter: blur(14px)
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 42px
        }

        .mark {
            width: 42px;
            height: 42px;
            border: 1px solid #343840;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font: 15px var(--mono);
            color: var(--accent)
        }

        .status {
            font: 11px var(--mono);
            color: var(--muted);
            letter-spacing: .04em
        }

        .status i {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8fa79a;
            margin-right: 7px;
            box-shadow: 0 0 10px #8fa79a
        }

        .name {
            font-size: clamp(42px, 13vw, 62px);
            line-height: .9;
            letter-spacing: -.06em;
            margin: 0 0 12px;
            font-weight: 650
        }

        .role {
            font: 13px var(--mono);
            color: var(--muted);
            letter-spacing: .02em
        }

        .rule {
            height: 1px;
            background: var(--line);
            margin: 38px 0
        }

        .terminal {
            font: 12px/1.8 var(--mono);
            margin-bottom: 30px
        }

        .prompt {
            color: var(--accent)
        }

        .value {
            color: #a7abb2
        }

        .links {
            display: grid;
            gap: 10px
        }

        .links a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text);
            border: 1px solid var(--line);
            background: var(--panel);
            padding: 15px 16px;
            border-radius: 12px;
            transition: .18s ease
        }

        .links a:hover {
            border-color: #42464e;
            transform: translateY(-1px);
            background: #14171b
        }

        .links span:first-child {
            font-size: 14px
        }

        .arrow {
            font-family: var(--mono);
            color: var(--muted)
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 28px;
            color: #4f535a;
            font: 10px var(--mono);
            text-transform: uppercase;
            letter-spacing: .08em
        }

        @media(max-width:420px) {
            body {
                padding: 14px
            }

            .card {
                padding: 22px;
                border-radius: 18px
            }

            .top {
                margin-bottom: 34px
            }

            .rule {
                margin: 32px 0
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="top">
            <div class="mark">S</div>

            <div class="status">
                <i></i>online / 2026
            </div>
        </div>

        <h1 class="name">Sasha</h1>

        <div class="role">Software and Electrical Engineer</div>
        
        <div class="rule"></div>
        
        <div class="terminal">
            <div class="value">
                interested in software development and computers
            </div>
        
            <br>
        
            <div>
                <span class="prompt">$ currently</span>
            </div>
        
            <div class="value">
                backend · java · systems
            </div>
        </div>

        <div class="links">

            <a href="https://t.me/Qib9jr" target="_blank" rel="noopener">
                <span>say hi</span>
                <span class="arrow">telegram →</span>
            </a>

            <a href="https://github.com/jir0175" target="_blank" rel="noopener">
                <span>code</span>
                <span class="arrow">github →</span>
            </a>

            <a href="https://vk.ru/id664250340" target="_blank" rel="noopener">
                <span>elsewhere</span>
                <span class="arrow">vk →</span>
            </a>

        </div>

        <div class="footer">
            <span>personal card</span>
            <span>nfc / qr</span>
        </div>

    </main>

</body>

</html>
